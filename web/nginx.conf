server {
    listen ${PORT};
    server_name ${WEB_DOMAIN} localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml
        application/javascript
        application/json
        image/svg+xml;

    # Health check endpoint for Docker
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"web"}';
    }

    # Dynamic runtime configuration for client-side JavaScript
    location = /config.js {
        default_type application/javascript;
        return 200 'window.__APP_CONFIG__ = { appName: "${APP_NAME}", webDomain: "${WEB_DOMAIN}", botUsername: "${BOT_USERNAME}", botUrl: "${BOT_URL}", supportBotUrl: "${SUPPORT_BOT_URL}", webAppUrl: "${WEB_APP_URL}", contactEmail: "${CONTACT_EMAIL}" };';
    }

    # Next.js static chunks with immutable caching
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Images and media with caching
    location ~* \.(webp|avif|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Route matching for static export with HTML fallback
    location / {
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
