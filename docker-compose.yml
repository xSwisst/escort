services:

  # API Service (только для web_app)
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: escort-api
    restart: unless-stopped
    env_file: ./api/.env
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - ./repository:/app/repository
      - ./services:/app/services
      - ./shared:/app/shared
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Photos Service (хранилище медиа)
  photos:
    build:
      context: .
      dockerfile: photos/Dockerfile
    container_name: escort-photos
    restart: unless-stopped
    env_file: ./photos/.env
    ports:
      - "8005:8005"
    volumes:
      - photos_storage:/data/photos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Logs Service (Telegram логирование)
  logs:
    build:
      context: .
      dockerfile: logs/Dockerfile
    container_name: escort-logs
    restart: unless-stopped
    env_file: ./logs/.env
    ports:
      - "8006:8006"
    volumes:
      - logs_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Main Bot
  main-bot:
    build:
      context: .
      dockerfile: main/Dockerfile
    container_name: escort-main-bot
    restart: unless-stopped
    env_file: ./main/.env
    ports:
      - "8001:8001"
    volumes:
      - ./main:/app
      - ./repository:/app/repository
      - ./services:/app/services
      - ./shared:/app/shared

  # Support Bot
  support-bot:
    build:
      context: .
      dockerfile: support/Dockerfile
    container_name: escort-support-bot
    restart: unless-stopped
    env_file: ./support/.env
    ports:
      - "8002:8002"
    volumes:
      - ./support:/app
      - ./repository:/app/repository
      - ./services:/app/services
      - ./shared:/app/shared

  # Admin Bot
  admin-bot:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: escort-admin-bot
    restart: unless-stopped
    env_file: ./admin/.env
    ports:
      - "8003:8003"
    volumes:
      - ./admin:/app
      - ./repository:/app/repository
      - ./services:/app/services
      - ./shared:/app/shared

  # Web App (FastAPI + React)
  web-app:
    build:
      context: .
      dockerfile: web_app/Dockerfile
    container_name: escort-web-app
    restart: unless-stopped
    env_file: ./web_app/.env
    ports:
      - "8004:8004"

  # Web Landing Service
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: escort-web
    restart: unless-stopped
    env_file: ./web/.env
    ports:
      - "8007:8007"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  photos_storage:
    name: escort_photos_storage
  logs_data:
    name: escort_logs_data

networks:
  default:
    name: infra_network
    external: true
